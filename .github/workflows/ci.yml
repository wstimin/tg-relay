name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.mjs && node --check web/theme.js && node --check web/icons.mjs
      - run: node scripts/test-web-update.mjs
      - run: bash -n install.sh scripts/test-install.sh scripts/test-update.sh && bash scripts/test-install.sh
      - run: shellcheck install.sh scripts/test-install.sh scripts/test-admin.sh scripts/test-update.sh
      - name: Verify systemd unit
        run: |
          go build -o .cache/verify/tg-relay .
          bash scripts/test-admin.sh .cache/verify/tg-relay
          sudo install -D .cache/verify/tg-relay /opt/tg-relay/tg-relay
          sudo useradd --system tg-relay
          sudo install -d /var/lib/tg-relay
          sudo install -m 0755 install.sh /opt/tg-relay/manage.sh
          systemd-analyze verify deploy/tg-relay.service deploy/tg-relay-renew.service deploy/tg-relay-renew.timer deploy/tg-relay-update.service deploy/tg-relay-update.path
